<!DOCTYPE html>
<html lang="zh-CN">
<head><!--v=6--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>两步路轨迹编辑器</title>
<link rel="stylesheet" href="/lib/leaflet.css">
<script src="/lib/leaflet.js"></script>
<style>
/* ===== 两步路轨迹编辑器 - 山野风主题 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --canvas: #181d26;
  --surface: #1d1f25;
  --surface-soft: #22252b;
  --border: #333840;
  --border-strong: #9297a0;
  --ink: #f8fafc;
  --body: #e0e2e5;
  --muted: #9297a0;
  --coral: #aa2d00;
  --peach: #fcab79;
  --cream: #f5e9d4;
  --green: #39bf45;
  --red: #e04848;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-pill: 9999px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--canvas);color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;width:100vw}
#map{flex:1;min-width:0;position:relative}
#panel{position:absolute;top:10px;right:10px;bottom:10px;width:300px;min-width:200px;max-width:500px;overflow-y:auto;background:transparent;display:flex;flex-direction:column;border-radius:var(--radius);z-index:1000}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}


#panel-body{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:64px 12px 0 12px;gap:16px}



/* Card sections */
.card{background:var(--surface-soft);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.35)}
.card-file{flex-shrink:0}
.card-delete{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:16px 12px 12px}

/* File info card */
.file-info{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.file-info .fi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0}
.file-info .name{font-size:20px;font-weight:700;color:var(--peach);letter-spacing:0.5px}
.fi-info{display:inline-flex;cursor:pointer;opacity:0.35;transition:opacity 0.15s;line-height:1;color:var(--muted)}
.fi-info:hover{opacity:1;color:var(--peach)}
.file-info .sub{font-size:12px;color:var(--muted);margin-bottom:10px}

/* Sectioned file info */
.fl-section{margin-bottom:8px}
.fl-section:last-child{margin-bottom:0}
.fl-header{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.fl-label{font-size:11px;font-weight:600;color:var(--body);text-transform:uppercase;letter-spacing:0.8px}

.fl-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0}
.fl-key{font-size:12px;color:var(--muted)}
.fl-val{font-size:14px;color:var(--cream);font-weight:400;margin-left:auto}
.fl-val s{opacity:0.5}
.fl-val .ev{color:var(--green);font-weight:600;font-style:normal}
.eye-btn{font-size:14px;cursor:pointer;opacity:0.5;transition:opacity 0.15s;line-height:1}
.eye-btn:hover{opacity:1}
.edited-badge{font-size:11px;background:var(--coral);color:#fff;border-radius:999px;padding:1px 7px;margin-left:8px;font-weight:600;vertical-align:middle}
.file-info .placeholder{text-align:center;padding:20px 0;color:var(--muted);font-size:12px}

/* Map switch */
.map-tools{position:fixed;bottom:24px;left:24px;z-index:2000;display:flex;gap:8px;align-items:center}
.map-switch{display:flex;gap:0;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.35)}
.map-switch button{padding:7px 16px;border:none;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.15s;outline:none;border-right:1px solid var(--border)}
.map-switch button:last-child{border-right:none}
.map-switch button.active{background:var(--coral);color:#fff}
.map-switch button:hover:not(.active){background:var(--border)}

/* Tool button (reset view, etc.) */

.btn-coral{background:var(--coral);color:#fff;font-weight:600}
.btn-coral:hover{background:#922700;box-shadow:0 0 12px rgba(170,45,0,0.25)}
.btn-muted{background:transparent;color:var(--muted);font-weight:400;border:1px solid var(--border);border-radius:9999px;padding:3px 10px;font-size:11px;cursor:pointer;transition:all 0.15s}
.btn-muted:hover{color:var(--coral);border-color:var(--coral)}

/* Waypoint marker */
.wp-icon{background:none;border:none}
.wp-diamond{width:14px;height:14px;background:var(--coral);border:2px solid #fff;transform:rotate(45deg);border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,0.4)}
.wp-popup{max-width:320px;font-size:12px;line-height:1.6;color:var(--body)}
.wp-popup h3{font-size:14px;color:var(--ink);margin:0 0 6px;font-weight:600}
.wp-popup .desc{color:var(--body);margin-bottom:8px}
.wp-popup img{max-width:100%;border-radius:6px;display:block;margin:4px auto 0}

/* Leaflet popup dark theme */
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--body)!important;border-radius:8px!important;border:1px solid var(--border)!important;min-width:260px!important}
.leaflet-popup-tip{background:var(--surface)!important;border:1px solid var(--border)!important}
.leaflet-popup-content{margin:12px 14px;font-size:12px;color:var(--body)}
.leaflet-popup-content h3{color:var(--ink);margin:0 0 6px;font-size:14px;font-weight:600}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:16px!important;top:6px!important;right:6px!important}
.leaflet-popup-close-button:hover{color:var(--coral)!important}

/* Delete card footer */
.del-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 0;flex-shrink:0}
.del-count{font-size:11px;color:var(--muted)}

/* Deletion list */
.del-list{font-size:13px;overflow-y:auto;flex:1;min-height:0;padding:0 12px 12px;position:relative}
.del-list .empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);white-space:nowrap}
.del-list .item{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background 0.15s;font-size:13px}
.del-list .item:hover{background:rgba(51,65,85,0.5)}
.del-list .item .label{flex:1;color:var(--body)}
.del-list .item .count{color:var(--muted)}
.del-list .item .remove{opacity:0;color:var(--red);font-size:12px;padding:0 2px;transition:opacity 0.15s;background:none;border:none;cursor:pointer}
.del-list .item:hover .remove{opacity:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border:none;border-radius:var(--radius-pill);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:all 0.15s;letter-spacing:0.2px}
.btn:active{transform:translateY(1px)}
.btn-coral:disabled{background:#3a2a22;color:#9a8078;box-shadow:none;opacity:1;cursor:not-allowed;transform:none}
.btn-group .btn{flex:1}



/* Overlay */
#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:16px}
#overlay .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top:3px solid var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Leaflet overrides */
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--border)!important;font-weight:bold!important}
.leaflet-control-zoom a:hover{background:var(--border)!important}
.leaflet-control-attribution{background:rgba(24,29,38,0.85)!important;color:var(--muted)!important;font-size:10px!important;padding:2px 6px!important}
.leaflet-control-attribution a{color:var(--coral)!important}
.leaflet-control{border:1px solid var(--border)!important;border-radius:var(--radius-sm)!important;overflow:hidden!important}
.leaflet-control-zoom{border:none!important}


/* Drop zone overlay on map */
#dropZone{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2000;display:flex;align-items:center;justify-content:center;transition:opacity 0.25s;pointer-events:none;opacity:0}
#dropZone.active{opacity:1;pointer-events:auto;background:rgba(24,29,38,0.7);backdrop-filter:blur(3px)}
#dropZone.permanent{opacity:1;pointer-events:auto}
#dropZone .hint{border:2px dashed var(--border-strong);border-radius:16px;padding:36px 48px;text-align:center;background:rgba(29,31,37,0.92);max-width:320px;transition:all 0.25s}
#dropZone.active .hint{border-color:var(--coral);border-style:solid;background:rgba(170,45,0,0.08)}
#dropZone .hint .icon{font-size:40px;display:block;margin-bottom:10px}
#dropZone .hint b{color:var(--ink);font-size:16px}
#dropZone .hint .sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}

/* Toast notification */
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 24px;border-radius:999px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;background:var(--surface);border:1px solid var(--border);color:var(--ink);box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
#toast.show{opacity:1;bottom:40px}
#toast.error{background:var(--coral);color:#fff;border-color:var(--coral)}
#toast.success{background:#166534;color:#fff;border-color:#166534}

/* Prompt modal */
.prompt-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5000;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.prompt-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.prompt-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px}
.prompt-input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--canvas);color:var(--ink);font-size:13px;outline:none;box-sizing:border-box}
.prompt-input:focus{border-color:var(--coral)}
.prompt-buttons{display:flex;gap:8px;margin-top:12px}
.prompt-buttons .ok{flex:1;background:var(--coral);color:#fff;border:none;border-radius:999px;padding:7px 0;font-size:12px;cursor:pointer;font-weight:500}
.prompt-buttons .ok:hover{background:#922700}
.prompt-buttons .cancel{flex:1;background:var(--border);color:var(--ink);border:none;border-radius:999px;padding:7px 0;font-size:12px;cursor:pointer}
.prompt-buttons .cancel:hover{background:var(--border-strong)}

/* Export button */
.btn-export{border-radius:9999px;margin:64px 12px 12px;flex-shrink:0;width:calc(100% - 24px);padding:14px 20px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,0.35)}

/* Zoom control spacing — match map switch 24px margin */
.leaflet-top.leaflet-left .leaflet-control { margin-left: 24px !important; margin-top: 24px !important; }

/* Map attribution */
#mapAttribution{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;font-size:10px;color:rgba(255,255,255,0.35);background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:4px;pointer-events:none;white-space:nowrap}
</style></head>
<body >
<div id="toast"></div>
<div id="overlay"><div class="spinner"></div><span id="overlayText">正在处理...</span></div>
<div id="app" >
  <div id="map">
    <div id="panel">
      <div id="panel-body">
        <div class="card card-file">
          <div class="file-info" id="fileInfo"></div>
        </div>
        <div class="card card-delete">
          <div id="removalsList" class="del-list"></div>
          <div class="del-footer" id="delFooter">
            <span class="del-count" id="delCount">已删除 0 段</span>
            <button class="btn-muted" id="btnClear">清空</button>
          </div>
        </div>
    </div>
    <button class="btn btn-coral btn-export" id="btnDownload" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 导出</button>
  </div>
    <div id="mapAttribution">卫星: Esri &mdash; 标准: © OpenStreetMap</div>
    <div class="map-tools" id="mapTools">
      <div class="map-switch" id="mapSwitch">
        <button data-map="satellite" class="active">卫星地图</button>
        <button data-map="osm">标准地图</button>
      </div>
    </div>
    <div id="dropZone">
      <div class="hint">
        <span class="icon">📂</span>
        <b>拖放 KMZ 文件到此处</b>
        <div class="sub">支持两步路导出的 .kmz 轨迹文件</div>
      </div>
    </div>
  </div>
</div>



<script src="/editor.js?t=20260516"></script>
</body>
</html>
