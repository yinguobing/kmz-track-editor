<!DOCTYPE html>
<html lang="zh-CN">
<head><!--v=1778844373--><meta charset="utf-8"><script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        forest: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' },
        earth: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
        sunset: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
      }
    }
  }
}
</script><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>两步路轨迹编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="/lib/leaflet.css">
<script src="/lib/leaflet.js"></script>
<style>
/* Minimal overrides for Leaflet and custom behavior */
#map{flex:1;height:100vh}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
#removalsList::-webkit-scrollbar{width:4px}
#removalsList::-webkit-scrollbar-thumb{background:#475569;border-radius:2px}
#status{max-height:120px;overflow-y:auto}
.leaflet-control-zoom a{background:#1e293b !important;color:#f1f5f9 !important;border-color:#334155 !important}
.leaflet-control-zoom a:hover{background:#334155 !important}
.leaflet-control-attribution{background:rgba(30,41,59,0.85) !important;color:#94a3b8 !important;font-size:10px !important;padding:2px 6px !important}
.leaflet-control-attribution a{color:#10b981 !important}
.leaflet-control{border:1px solid #334155 !important;border-radius:5px !important;overflow:hidden !important}
.leaflet-control-zoom{border:none !important}
#overlay{backdrop-filter:blur(4px)}
</style></head>
<body class="bg-earth-900 text-earth-100 antialiased">
<div id="overlay"><div class="spinner"></div><span id="overlayText">正在处理...</span></div>
<div id="app" class="flex h-screen w-screen">
  <div id="map"></div>
  <div id="panel" class="w-[290px] min-w-[290px] bg-earth-800 border-l border-earth-700 flex flex-col overflow-y-auto">
    <div id="panel-header" class="px-4 py-3 border-b border-earth-700 font-bold text-base flex items-center gap-2 bg-gradient-to-r from-forest-900/30 to-transparent text-forest-400">
      <span class="track-icon">&#9998;</span> <span>两步路轨迹编辑器</span>
    </div>
    <div id="panel-body" class="p-3 flex-1 space-y-2.5">
      <div class="bg-earth-800 border border-earth-700 rounded-lg p-3">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-earth-400 mb-2 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-forest-500"></span> 底图</div>
        <select id="mapSelect" class="w-full px-2.5 py-1.5 rounded bg-earth-900 border border-earth-600 text-earth-100 text-xs outline-none focus:border-forest-500 transition-colors cursor-pointer">
          <option value="satellite">&#128147; 卫星地图</option>
          <option value="osm">&#127758; 标准地图</option>
        </select>
      </div>
      <div class="bg-earth-800 border border-earth-700 rounded-lg p-3">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-earth-400 mb-2 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-forest-500"></span> 选择与标记</div>
        <label class="flex items-center gap-1.5 text-xs text-earth-300 cursor-pointer py-1 select-none"><input type="checkbox" id="modeSel" class="accent-forest-500 w-3.5 h-3.5 cursor-pointer"> 选择模式（点选轨迹起点/终点）</label>
        <div class="flex flex-wrap gap-1 mt-1.5">
          <button class="bg-red-600 hover:bg-red-500 hover:shadow-lg hover:shadow-red-500/20 text-white font-semibold rounded px-3 py-1.5 text-xs transition-all active:translate-y-px" id="btnDel">&#128465; 删除范围</button>
          <button class="bg-earth-700 hover:bg-earth-600 text-earth-100 font-semibold rounded px-3 py-1.5 text-xs border border-earth-600 transition-all active:translate-y-px" id="btnClear">清除选区</button>
        </div>
        <button class="bg-red-600 hover:bg-red-500 hover:shadow-lg hover:shadow-red-500/20 text-white font-semibold rounded px-3 py-1.5 text-xs transition-all active:translate-y-px" id="btnClearAll" style="background:#b91c1c;margin-top:4px;width:100%">✕ 清空所有删除标记</button>
      </div>
      <div class="bg-earth-800 border border-earth-700 rounded-lg p-3">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-earth-400 mb-2 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-forest-500"></span> 操作</div>
        <div class="flex flex-wrap gap-1">
          <button class="bg-blue-600 hover:bg-blue-500 hover:shadow-lg hover:shadow-blue-500/20 text-white font-semibold rounded px-3 py-1.5 text-xs transition-all active:translate-y-px" id="btnShow">&#128196; 删除列表</button>
          <a href="/upload" style="flex:1;text-decoration:none"><button class="bg-purple-600 hover:bg-purple-500 hover:shadow-lg hover:shadow-purple-500/20 text-white font-semibold rounded px-3 py-1.5 text-xs w-full transition-all active:translate-y-px">📤 上传 KMZ</button></a>
        </div>
        <button class="bg-forest-600 hover:bg-forest-500 hover:shadow-lg hover:shadow-forest-500/20 text-white font-semibold rounded px-3 py-2 text-xs w-full mt-1 transition-all active:translate-y-px" id="btnDownload">&#11015; 下载 KMZ</button>
      </div>
      <div class="bg-earth-800 border border-earth-700 rounded-lg p-3">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-earth-400 mb-2 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-forest-500"></span> 统计</div>
        <div class="text-xs text-earth-400 leading-relaxed bg-black/15 rounded p-2">
          总点数 <b id="totalPts">3245</b><br>
          已标记删除 <b class="red" id="delPts">0</b><br>
          最终点数 <b class="green" id="finalPts">3245</b>
        </div>
      </div>
      <div class="bg-earth-800 border border-earth-700 rounded-lg p-3">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-earth-400 mb-2 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-forest-500"></span> 状态</div>
        <div id="status" class="text-xs leading-relaxed bg-black/15 rounded p-2 text-earth-400"><b>青见梁穿越线</b><br>点击轨迹看详情。勾选「选择模式」后点选起点/终点。</div>
      </div>
      <div class="bg-earth-800 border border-earth-700 rounded-lg p-3">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-earth-400 mb-2 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-forest-500"></span> 待删除范围</div>
        <div id="removalsList"></div>
      </div>
    </div>
  </div>
</div>

<script>

function updateStatsWithLocalStorage() {
  var saved = localStorage.getItem("trackEditor_removals");
  if (saved) {
    try {
      rv = JSON.parse(saved);
      if (rv.length > 0) {
        var d = rv.reduce(function(a,r){return a+r.end-r.start+1}, 0);
        document.getElementById("delPts").textContent = d;
        document.getElementById("finalPts").textContent = P.length - d;
        document.getElementById("status").innerHTML = "<b>" + (trackName || "轨迹") + "</b><br><span style=\"color:#fbbf24\">恢复 " + rv.length + " 个删除标记</span>";
      }
    } catch(e) {}
  }
}

var trackName = "两步路轨迹编辑器";
var DATA = [];  // loaded from track_data.json


var P = [];

// Load track data from JSON
fetch('/track_data.json').then(function(r){return r.json();}).then(function(d){
  DATA = d;
  P = DATA.map(function(d){return{idx:d[0],lat:d[1],lng:d[2],alt:d[3],time:d[4]};});
  rebuildMap();
  updateStatsWithLocalStorage();
}).catch(function(e){
  console.warn('No track data, upload a KMZ file:', e);
  P=[];
  rebuildMap();
});

function rebuildMap() {
  if (P.length === 0) { document.getElementById("status").innerHTML = "<b>无轨迹数据</b><br>请上传 KMZ 文件"; return; }
var mm = L.map('map', {zoomControl: true, maxZoom: 20, attributionControl: false}).setView([38.972362000000004, 112.4864345], 12);

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: 'OSM', maxZoom: 20});
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution: 'Esri', maxZoom: 20, maxNativeZoom: 17});
var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {attribution: 'Esri', maxZoom: 20, maxNativeZoom: 17});
sat.addTo(mm);
labels.addTo(mm);
var activeLabels = labels;

document.getElementById('mapSelect').onchange = function() {
  if (this.value == 'satellite') {
    mm.removeLayer(osm);
    sat.addTo(mm);
    labels.addTo(mm);
    activeLabels = labels;
  } else {
    mm.removeLayer(sat);
    mm.removeLayer(labels);
    activeLabels = null;
    osm.addTo(mm);
  }
};

var pts = P.map(function(p) { return [p.lat, p.lng]; });
var pl = L.polyline(pts, {color: '#22c55e', weight: 4, opacity: 0.8}).addTo(mm);

var step = Math.max(1, Math.floor(P.length / 30));
for (var i = 0; i < P.length; i += step) {
  (function(j) {
    L.circleMarker([P[j].lat, P[j].lng], {
      radius: 4, color: '#3b82f6', fill: true,
      fillColor: '#3b82f6', fillOpacity: 0.8, weight: 1
    }).addTo(mm).bindTooltip('#' + j).on('click', function() { showInfo(j); });
  })(i);
}

function nearestLL(latlng) {
  var d = Infinity, n = null;
  for (var i = 0; i < P.length; i++) {
    var dist = mm.distance(latlng, [P[i].lat, P[i].lng]);
    if (dist < d) { d = dist; n = i; }
  }
  return n;
}

function showInfo(i) {
  document.getElementById('status').innerHTML =
    '<b>#' + i + '</b><br>时间: ' + P[i].time +
    '<br>纬度: ' + P[i].lat.toFixed(6) +
    '<br>经度: ' + P[i].lng.toFixed(6) +
    '<br>海拔: ' + P[i].alt + 'm';
}

pl.on('click', function(e) {
  var i = nearestLL(e.latlng);
  if (i != null) showInfo(i);
});

var ss = null, se = null, sm = [], rv = [], removedLines = [];

// Restore deletion marks from localStorage on page load
(function() {
  var saved = localStorage.getItem('trackEditor_removals');
  if (saved) {
    try {
      rv = JSON.parse(saved);
      if (rv.length > 0) {
        document.getElementById('status').innerHTML += '<br><span style="color:#fbbf24">↻ 已恢复 ' + rv.length + ' 个删除标记</span>';
        var del = rv.reduce(function(a, r) { return a + r.end - r.start + 1; }, 0);
        document.getElementById('delPts').textContent = del;
        document.getElementById('finalPts').textContent = P.length - del;
      }
    } catch(e) {}
  }
})();

document.getElementById('modeSel').onchange = function() { if (!this.checked) clearSel(); };

function clearAll() {
  if (rv.length > 0 && confirm('确定清除所有删除标记吗？')) {
    rv = [];
    localStorage.removeItem('trackEditor_removals');
    document.getElementById('delPts').textContent = '0';
    document.getElementById('finalPts').textContent = P.length;
    // Also clear visual markers
    removedLines.forEach(function(l) { mm.removeLayer(l); });
    removedLines = [];
    document.getElementById('removalsList').style.display = 'none';
    document.getElementById('status').innerHTML = '<b>' + trackName + '</b><br>已清除所有删除标记';
  }
}
function clearSel() {
  ss = null; se = null;
  sm.forEach(function(x) { mm.removeLayer(x); });
  sm = [];
}

document.getElementById('btnClear').onclick = clearSel;
document.getElementById('btnClearAll').onclick = clearAll;

function updateSel() {
  sm.forEach(function(x) { mm.removeLayer(x); });
  sm = [];
  if (ss != null && se != null) {
    var s = Math.min(ss, se), e = Math.max(ss, se);
    var sl = L.polyline(pts.slice(s, e + 1), {color: '#ef4444', weight: 6, opacity: 0.9}).addTo(mm);
    sm.push(sl);
    var sm1 = L.circleMarker([P[s].lat, P[s].lng], {radius: 8, color: '#ef4444', fill: true, fillColor: '#ef4444', fillOpacity: 1, weight: 2}).addTo(mm);
    sm1.bindTooltip('#' + s);
    sm.push(sm1);
    var sm2 = L.circleMarker([P[e].lat, P[e].lng], {radius: 8, color: '#ef4444', fill: true, fillColor: '#ef4444', fillOpacity: 1, weight: 2}).addTo(mm);
    sm2.bindTooltip('#' + e);
    sm.push(sm2);
    mm.fitBounds(sl.getBounds(), {padding: [30, 30]});
  } else if (ss != null) {
    var sm1 = L.circleMarker([P[ss].lat, P[ss].lng], {radius: 8, color: '#f59e0b', fill: true, fillColor: '#f59e0b', fillOpacity: 1, weight: 2}).addTo(mm);
    sm1.bindTooltip('#' + ss);
    sm.push(sm1);
  }
}

mm.on('click', function(e) {
  if (!document.getElementById('modeSel').checked) return;
  var i = nearestLL(e.latlng);
  if (i == null) return;
  if (ss == null) {
    ss = i;
    showInfo(i);
  } else if (se == null && ss != null) {
    if (i == ss) {
      ss = null;
    } else {
      se = i;
      var s = Math.min(ss, se), e = Math.max(ss, se);
      document.getElementById('status').innerHTML = '选中 <b>#' + s + '</b> &rarr; <b>#' + e + '</b> (' + (e - s + 1) + ' pts)';
    }
  }
  updateSel();
});

document.getElementById('btnDel').onclick = function() {
  if (ss == null || se == null) return;
  var s = Math.min(ss, se), e = Math.max(ss, se);
  rv.push({start: s, end: e});
  var rl = L.polyline(pts.slice(s, e + 1), {color: '#ef4444', weight: 4, opacity: 0.5, dashArray: '6,4'}).addTo(mm);
  removedLines.push(rl);
  var del = rv.reduce(function(a, r) { return a + r.end - r.start + 1; }, 0);
  document.getElementById('delPts').textContent = del;
  document.getElementById('finalPts').textContent = P.length - del;
  document.getElementById('status').innerHTML = '已标记删除 <b>#' + s + '</b> &rarr; <b>#' + e + '</b>';
  clearSel();
};

document.getElementById('btnShow').onclick = function() {
  var el = document.getElementById('removalsList');
  if (el.style.display == 'block') { el.style.display = 'none'; return; }
  var h = '';
  for (var i = 0; i < rv.length; i++) {
    h += '<div>#' + rv[i].start + ' &rarr; #' + rv[i].end + ' (' + (rv[i].end - rv[i].start + 1) + ' pts)</div>';
  }
  if (!h) h = '<div style="color:#6b7280">暂无删除记录</div>';
  el.innerHTML = '<b>待删除范围</b>' + h +
    '<button class="bg-earth-700 hover:bg-earth-600 text-earth-100 font-semibold rounded px-3 py-1.5 text-xs border border-earth-600 transition-all active:translate-y-px" id="closeRemovalBtn" style="margin-top:4px;width:100%;padding:2px 0;font-size:11px">关闭</button>';
  document.getElementById('closeRemovalBtn').onclick = function() { el.style.display = 'none'; };
  el.style.display = 'block';
};

document.getElementById('btnDownload').onclick = function() {
  var overlay = document.getElementById('overlay');
  document.getElementById('overlayText').textContent = '正在处理 ' + rv.length + ' 个删除范围...';
  overlay.style.display = 'flex';
  fetch('/api/apply-edits', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({removals: rv, totalPts: P.length})
  }).then(function(r) { return r.json(); }).then(function(data) {
    document.getElementById('overlayText').textContent = '处理完成，正在下载...';
    setTimeout(function() {
      overlay.style.display = 'none';
      window.location.href = data.downloadUrl || '/download/edited_track.kmz';
    }, 2000);
  }).catch(function(e) {
    overlay.style.display = 'none';
    var txt = JSON.stringify(rv);
    alert('请将以下内容复制发送给小满：\n\n' + txt);
    prompt('发送给小满', txt);
  });
};

mm.fitBounds(pl.getBounds(), {padding: [30, 30]})
};
</script></body></html>
