<!DOCTYPE html>
<html lang="zh-CN">
<head><!--v=1778844373--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>两步路轨迹编辑器</title>
<link rel="stylesheet" href="/lib/leaflet.css">
<script src="/lib/leaflet.js"></script>
<style>
/* ===== 两步路轨迹编辑器 - 山野风主题 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --canvas: #181d26;
  --surface: #1d1f25;
  --surface-soft: #22252b;
  --border: #333840;
  --border-strong: #9297a0;
  --ink: #f8fafc;
  --body: #e0e2e5;
  --muted: #9297a0;
  --coral: #aa2d00;
  --forest: #1a5e2e;
  --peach: #fcab79;
  --mint: #a8d8c4;
  --cream: #f5e9d4;
  --green: #39bf45;
  --green-hover: #2da838;
  --red: #e04848;
  --red-hover: #c73a3a;
  --blue: #458fff;
  --amber: #d9a441;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-pill: 9999px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--canvas);color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;width:100vw}
#map{flex:1;height:100vh}

/* Sidebar */
#panel{width:300px;min-width:200px;max-width:500px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;position:relative}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

#panel-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;background:linear-gradient(135deg,rgba(170,45,0,0.08) 0%,transparent 60%);letter-spacing:0.3px;color:var(--coral)}
#panel-body{flex:1;display:flex;flex-direction:column;overflow:hidden}

.section{padding:12px 16px;border-bottom:1px solid var(--border)}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.section-title .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--coral)}
.section-export{flex-shrink:0;border-top:1px solid var(--border);background:rgba(24,29,38,0.8);padding:10px 16px}
.section-scroll{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* Stats row */
.stats-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--body);margin-bottom:8px}
.stats-row b{color:var(--ink)}
.stats-row .red{color:var(--red)}
.stats-row .green{color:var(--coral)}

.section-ops{flex-shrink:0;padding:10px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column}
/* Selection info */

/* File info card */
.file-info{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.file-info .name{font-size:18px;font-weight:700;color:var(--peach);margin-bottom:8px;letter-spacing:0.5px}
.file-info .meta-row{font-size:11px;color:var(--body);line-height:1.9}
.file-info .meta-row .label{color:var(--muted)}
.file-info .placeholder{text-align:center;padding:20px 0;color:var(--muted);font-size:12px}
.file-info .placeholder .icon{font-size:28px;display:block;margin-bottom:8px}

/* Map switch */
.map-switch{display:flex;gap:4px;margin-bottom:10px}
.map-switch button{flex:1;padding:5px 0;border-radius:999px;border:1px solid var(--border);background:var(--canvas);color:var(--muted);font-size:11px;cursor:pointer;transition:all 0.15s;outline:none}
.map-switch button.active{background:var(--surface-soft);border-color:var(--coral);color:var(--ink)}
.map-switch button:hover:not(.active){border-color:var(--border-strong)}

.btn-peach{background:var(--peach);color:var(--canvas);font-weight:600}
.btn-peach:hover{background:#f09a65}

/* Deletion list */
.del-list{font-size:11px;overflow-y:auto;flex:1;min-height:0}
.del-list .empty{text-align:center;padding:16px;color:var(--muted)}
.del-list .item{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:4px;cursor:pointer;transition:background 0.15s;font-size:11px}
.del-list .item:hover{background:rgba(51,65,85,0.5)}
.del-list .item .label{flex:1;color:var(--body)}
.del-list .item .count{color:var(--muted)}
.detail-text{font-size:10px;color:var(--muted)}
.del-list .item .remove{opacity:0;color:var(--red);font-size:12px;padding:0 2px;transition:opacity 0.15s;background:none;border:none;cursor:pointer}
.del-list .item:hover .remove{opacity:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border:none;border-radius:var(--radius-pill);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all 0.15s;letter-spacing:0.2px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.btn-full{width:100%}
.btn-primary{background:var(--ink);color:var(--canvas);font-weight:500}
.btn-primary:hover:not(:disabled){background:var(--border-strong)}
.btn-red{background:var(--coral);color:#fff}
.btn-red:hover:not(:disabled){background:#922700;box-shadow:0 0 12px rgba(170,45,0,0.25)}
.btn-gray{background:var(--border);color:var(--ink);border:1px solid var(--border)}
.btn-gray:hover{background:var(--border-strong)}
.btn-secondary{background:transparent;color:var(--body);border:1px solid var(--border);font-weight:400}
.btn-purple{background:var(--peach);color:var(--canvas)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-group{display:flex;gap:6px}
.btn-group .btn{flex:1}

/* Select/dropdown */
select{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--canvas);color:var(--ink);font-size:12px;width:100%;cursor:pointer;outline:none;transition:border-color 0.15s}
select:hover,select:focus{border-color:var(--coral)}

/* Checkbox */
.checkbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--body);cursor:pointer;padding:4px 0;user-select:none}
.checkbox input{accent-color:var(--coral);width:15px;height:15px;cursor:pointer}

/* Status */
#status{font-size:12px;line-height:1.6;background:rgba(0,0,0,0.15);border-radius:var(--radius-sm);padding:8px 10px;max-height:120px;overflow-y:auto;color:var(--body)}
#status b{color:var(--ink)}

/* Overlay */
#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:16px}
#overlay .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top:3px solid var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Leaflet overrides */
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--border)!important;font-weight:bold!important}
.leaflet-control-zoom a:hover{background:var(--border)!important}
.leaflet-control-attribution{background:rgba(24,29,38,0.85)!important;color:var(--muted)!important;font-size:10px!important;padding:2px 6px!important}
.leaflet-control-attribution a{color:var(--coral)!important}
.leaflet-control{border:1px solid var(--border)!important;border-radius:var(--radius-sm)!important;overflow:hidden!important}
.leaflet-control-zoom{border:none!important}
/* Resize handle */
#resizeHandle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:1000;background:transparent}

/* Drop zone overlay on map */
#dropZone{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2000;display:flex;align-items:center;justify-content:center;transition:opacity 0.25s;pointer-events:none;opacity:0}
#dropZone.active{opacity:1;pointer-events:auto;background:rgba(24,29,38,0.7);backdrop-filter:blur(3px)}
#dropZone.permanent{opacity:1;pointer-events:auto}
#dropZone .hint{border:2px dashed var(--border-strong);border-radius:16px;padding:36px 48px;text-align:center;background:rgba(29,31,37,0.92);max-width:320px;transition:all 0.25s}
#dropZone.active .hint{border-color:var(--coral);border-style:solid;background:rgba(170,45,0,0.08)}
#dropZone .hint .icon{font-size:40px;display:block;margin-bottom:10px}
#dropZone .hint b{color:var(--ink);font-size:14px}
#dropZone .hint .sub{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
</style></head>
<body >
<div id="overlay"><div class="spinner"></div><span id="overlayText">正在处理...</span></div>
<div id="app" >
  <div id="map">
    <div id="dropZone">
      <div class="hint">
        <span class="icon">📂</span>
        <b>拖放 KMZ 文件到此处</b>
        <div class="sub">支持两步路导出的 .kmz 轨迹文件</div>
      </div>
    </div>
  </div>
  <div id="panel" id="panel">

                <div id="panel-body">
      <!-- 文件信息 -->
      <div class="file-info" id="fileInfo"></div>
      
      <!-- 底图切换 -->
      <div class="map-switch" id="mapSwitch" style="flex-shrink:0;padding:10px 16px;border-bottom:1px solid var(--border)">
        <button data-map="satellite" class="active">卫星地图</button>
        <button data-map="osm">标准地图</button>
      </div>
      
      <!-- 已删除列表（弹性填充） -->
      <div class="section-scroll">
        <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span><span class="dot"></span> 已删除路径</span>
          <span style="color:var(--coral);font-size:10px;font-weight:400" id="delListCount">0 段</span>
        </div>
        <div id="removalsList" class="del-list"></div>
      </div>
      
      <!-- 底部：统计 + 导出（固定） -->
      <div class="section-export">
        <div class="stats-row" id="statsRow">
          <span>总 <b id="totalPts">0</b></span>
          <span>已删 <b class="red" id="delPts">0</b></span>
          <span>最终 <b class="green" id="finalPts">0</b></span>
        </div>
        <button class="btn btn-peach btn-full" id="btnDownload">导出</button>
      </div></div>
  </div>
</div>



<script src="/editor.js"></script>
</body>
</html>
