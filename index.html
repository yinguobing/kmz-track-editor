<!DOCTYPE html>
<html lang="zh-CN">
<head><!--v=1778844373--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>两步路轨迹编辑器</title>
<link rel="stylesheet" href="/lib/leaflet.css">
<script src="/lib/leaflet.js"></script>
<style>
/* ===== 两步路轨迹编辑器 - 山野风主题 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --bg-deep: #0f172a;
  --bg-surface: #1e293b;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --border: #334155;
  --border-light: #475569;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --green: #059669;
  --green-hover: #047857;
  --red: #ef4444;
  --red-hover: #dc2626;
  --blue: #3b82f6;
  --purple: #7c3aed;
  --amber: #f59e0b;
  --radius: 8px;
  --radius-sm: 5px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-deep);color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;width:100vw}
#map{flex:1;height:100vh}

/* Sidebar */
#panel{width:300px;min-width:200px;max-width:500px;background:var(--bg-surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;position:relative}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

#panel-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;background:linear-gradient(135deg,rgba(5,150,105,0.08) 0%,transparent 60%);letter-spacing:0.3px;color:var(--green)}
#panel-body{flex:1;display:flex;flex-direction:column;overflow:hidden}

.section{padding:12px 16px;border-bottom:1px solid var(--border)}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.section-title .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green)}
.section-export{border-top:1px solid var(--border);background:rgba(30,41,59,0.8);padding:12px 16px}
.section-scroll{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* Stats row */
.stats-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.stats-row b{color:var(--text)}
.stats-row .red{color:var(--red)}
.stats-row .green{color:var(--green)}

/* Selection info */
.sel-info{font-size:12px;color:var(--text-secondary);background:rgba(0,0,0,0.15);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;line-height:1.6;min-height:54px;max-height:100px;overflow-y:auto}

/* Deletion list */
.del-list{font-size:11px;overflow-y:auto;flex:1;min-height:0}
.del-list .empty{text-align:center;padding:16px;color:var(--text-muted)}
.del-list .item{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:4px;cursor:pointer;transition:background 0.15s;font-size:11px}
.del-list .item:hover{background:rgba(51,65,85,0.5)}
.del-list .item .label{flex:1;color:var(--text-secondary)}
.del-list .item .count{color:var(--text-muted)}
.detail-text{font-size:10px;color:var(--text-muted)}
.del-list .item .remove{opacity:0;color:var(--red);font-size:12px;padding:0 2px;transition:opacity 0.15s;background:none;border:none;cursor:pointer}
.del-list .item:hover .remove{opacity:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:all 0.15s;letter-spacing:0.2px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.btn-full{width:100%}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover:not(:disabled){background:var(--green-hover);box-shadow:0 0 12px rgba(5,150,105,0.3)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover:not(:disabled){background:var(--red-hover);box-shadow:0 0 12px rgba(239,68,68,0.25)}
.btn-gray{background:var(--bg-hover);color:var(--text);border:1px solid var(--border)}
.btn-gray:hover{background:var(--border-light)}
.btn-blue{background:var(--blue);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-group{display:flex;gap:6px}
.btn-group .btn{flex:1}

/* Select/dropdown */
select{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-deep);color:var(--text);font-size:12px;width:100%;cursor:pointer;outline:none;transition:border-color 0.15s}
select:hover,select:focus{border-color:var(--green)}

/* Checkbox */
.checkbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);cursor:pointer;padding:4px 0;user-select:none}
.checkbox input{accent-color:var(--green);width:15px;height:15px;cursor:pointer}

/* Status */
#status{font-size:12px;line-height:1.6;background:rgba(0,0,0,0.15);border-radius:var(--radius-sm);padding:8px 10px;max-height:120px;overflow-y:auto;color:var(--text-secondary)}
#status b{color:var(--text)}

/* Overlay */
#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:16px}
#overlay .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top:3px solid var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Leaflet overrides */
.leaflet-control-zoom a{background:var(--bg-surface)!important;color:var(--text)!important;border-color:var(--border)!important;font-weight:bold!important}
.leaflet-control-zoom a:hover{background:var(--bg-hover)!important}
.leaflet-control-attribution{background:rgba(30,41,59,0.85)!important;color:var(--text-muted)!important;font-size:10px!important;padding:2px 6px!important}
.leaflet-control-attribution a{color:var(--green)!important}
.leaflet-control{border:1px solid var(--border)!important;border-radius:var(--radius-sm)!important;overflow:hidden!important}
.leaflet-control-zoom{border:none!important}
/* Resize handle */
#resizeHandle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:1000;background:transparent}
</style></head>
<body >
<div id="overlay"><div class="spinner"></div><span id="overlayText">正在处理...</span></div>
<div id="app" >
  <div id="map"></div>
  <div id="panel" id="panel">
    <div id="panel-header" >
      <span class="track-icon">&#9998;</span> <span>两步路轨迹编辑器</span>
    </div>
            <div id="panel-body">
      <!-- Section 2: 项目配置 -->
      <div class="section">
        <div class="section-title"><span class="dot"></span> 项目配置</div>
        <button class="btn btn-purple btn-full" style="margin-bottom:8px" onclick="document.getElementById('uploadModal').style.display='flex'">📤 导入 KMZ</button>
        <select id="mapSelect">
          <option value="satellite">🛰️ 卫星地图</option>
          <option value="osm">🗺️ 标准地图</option>
        </select>
      </div>
      
      <!-- Section 3: 操作区 -->
      <div class="section">
        <div class="section-title"><span class="dot"></span> 操作区</div>
        <div id="selectionInfo" class="sel-info">点选轨迹上的起点和终点</div>
        <div class="btn-group">
          <button class="btn btn-red" id="btnConfirmDel" disabled>&#128465; 确定删除</button>
          <button class="btn btn-gray" id="btnClear" disabled>清除</button>
        </div>
      </div>
      
      <!-- Section 4: 已删除列表 -->
      <div class="section section-scroll">
        <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
          <span><span class="dot"></span> 已删除路径</span>
          <span style="color:var(--red);font-size:10px;font-weight:400" id="delListCount">0 段</span>
        </div>
        <div id="removalsList" class="del-list"></div>
      </div>
      
      <!-- Section 5: 统计与导出 -->
      <div class="section-export">
        <div class="section-title"><span class="dot"></span> 统计与导出</div>
        <div class="stats-row">
          <span>总 <b id="totalPts">0</b></span>
          <span>已删 <b class="red" id="delPts">0</b></span>
          <span>最终 <b class="green" id="finalPts">0</b></span>
        </div>
        <button class="btn btn-green btn-full" id="btnDownload">&#11015; 下载 KMZ</button>
      </div>
    </div></div>
  </div>
</div>

<!-- Upload Modal -->
<div id="uploadModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:4000;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center">
  <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;text-align:center;max-width:420px;width:90%">
    <h3 style="margin:0 0 4px;font-size:16px;color:#f1f5f9">📂 上传 KMZ 轨迹</h3>
    <p style="margin:0 0 16px;color:#94a3b8;font-size:13px">支持两步路导出的 .kmz 文件</p>
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="kmz" accept=".kmz" required style="margin:8px 0;color:#f1f5f9;font-size:13px"><br>
      <button type="submit" class="btn btn-green" style="padding:8px 24px;margin-top:4px">上传并加载</button>
    </form>
    <div id="uploadStatus" style="margin-top:12px;font-size:13px"></div>
    <button onclick="document.getElementById('uploadModal').style.display='none'" class="btn btn-gray" style="margin-top:8px;padding:4px 16px">取消</button>
  </div>
</div>

<script src="/editor.js"></script>
</body>
</html>
