<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>上传轨迹</title>
<style>
body{font-family:sans-serif;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:32px;text-align:center;max-width:420px;width:90%}
h2{margin:0 0 8px;font-size:18px}
p{margin:0 0 16px;color:#9ca3af;font-size:13px}
input[type=file]{margin:12px 0;color:#fff;font-size:13px}
.btn{background:#059669;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:#047857}
#status{margin-top:16px;font-size:13px;line-height:1.8}
.success{color:#22c55e}
.error{color:#ef4444}
a{color:#60a5fa}
</style></head><body>
<div class="card">
<h2>📂 上传 KMZ 轨迹文件</h2>
<p>支持两步路导出的 .kmz 文件</p>
<form id="uploadForm" enctype="multipart/form-data">
<input type="file" name="kmz" accept=".kmz" required><br>
<button class="btn" type="submit">上传并加载到编辑器</button>
</form>
<div id="status"></div>
</div>
<script>
document.getElementById('uploadForm').onsubmit = async function(e) {
  e.preventDefault();
  var st = document.getElementById('status');
  st.innerHTML = '⏳ 正在上传处理...';
  var fd = new FormData(this);
  try {
    var r = await fetch('/upload', {method:'POST', body:fd});
    var d = await r.json();
    if (d.success) {
      st.innerHTML = '<div class="success">✅ 上传成功！' + d.message + '</div><a href="/">返回编辑器</a>';
    } else {
      st.innerHTML = '<div class="error">❌ 失败: ' + d.error + '</div>';
    }
  } catch(e) {
    st.innerHTML = '<div class="error">❌ 网络错误: ' + e.message + '</div>';
  }
};
</script></body></html>
